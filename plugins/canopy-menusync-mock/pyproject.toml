[project]
name = "canopy-menusync-mock"
version = "0.1.0"
description = "Mock menu-sync plugin for Canopy — a real, installed, testable reference implementation of the MenuSync interface with no external dependency, for facilities that don't have a real POS/menu integration yet."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "canopy-agent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.entry-points."canopy.menu_sync"]
mock = "canopy_menusync_mock:MockMenuSync"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canopy_menusync_mock*"]
