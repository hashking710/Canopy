[project]
name = "canopy-adapter-hobolink"
version = "0.1.0"
description = "Onset HOBOlink Web Services V3 sensor adapter for Canopy (HOBO data loggers)"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "canopy-agent",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.entry-points."canopy.sensor_adapters"]
hobolink = "canopy_adapter_hobolink:HobolinkAdapter"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canopy_adapter_hobolink*"]
