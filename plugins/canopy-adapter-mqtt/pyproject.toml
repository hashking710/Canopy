[project]
name = "canopy-adapter-mqtt"
version = "0.1.0"
description = "Generic MQTT-subscribe sensor adapter for Canopy — works with ESPHome, Tasmota, Zigbee2MQTT, and anything else that publishes numeric values to MQTT"
requires-python = ">=3.11"
dependencies = [
    "canopy-agent",
    "aiomqtt>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.entry-points."canopy.sensor_adapters"]
mqtt = "canopy_adapter_mqtt:MqttSubscribeAdapter"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canopy_adapter_mqtt*"]
