[project]
name = "canopy-adapter-aranet4"
version = "0.1.0"
description = "Aranet4 BLE NDIR CO2 sensor adapter for Canopy — the accurate CO2 sensor the grow community actually uses"
requires-python = ">=3.11"
dependencies = [
    "canopy-agent",
    "bleak>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.entry-points."canopy.sensor_adapters"]
aranet4 = "canopy_adapter_aranet4:Aranet4Adapter"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canopy_adapter_aranet4*"]
