[project]
name = "canopy-compliancesync-metrc"
version = "0.1.0"
description = "METRC compliance-sync plugin for Canopy — reports plant/harvest/waste/package events to METRC's real v1 API"
requires-python = ">=3.11"
dependencies = [
    "canopy-agent",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiohttp>=3.9",
]

[project.entry-points."canopy.compliance_sync"]
metrc = "canopy_compliancesync_metrc:MetrcComplianceSync"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canopy_compliancesync_metrc*"]
