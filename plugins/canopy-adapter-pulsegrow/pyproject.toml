[project]
name = "canopy-adapter-pulsegrow"
version = "0.1.0"
description = "Pulse Grow sensor adapter scaffold for Canopy (VPD/CO2/PPFD environmental sensors)"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "canopy-agent",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.entry-points."canopy.sensor_adapters"]
pulsegrow = "canopy_adapter_pulsegrow:PulseGrowAdapter"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canopy_adapter_pulsegrow*"]
