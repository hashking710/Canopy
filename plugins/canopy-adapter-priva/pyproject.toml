[project]
name = "canopy-adapter-priva"
version = "0.1.0"
description = "Priva Building Automation Realtime Data API sensor adapter for Canopy (enterprise greenhouse climate computers)"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "canopy-agent",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.entry-points."canopy.sensor_adapters"]
priva = "canopy_adapter_priva:PrivaAdapter"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canopy_adapter_priva*"]
