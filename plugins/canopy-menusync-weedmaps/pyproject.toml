[project]
name = "canopy-menusync-weedmaps"
version = "0.1.0"
description = "Weedmaps menu-sync plugin for Canopy — pushes current inventory/genetics/potency to a Weedmaps for Business menu"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "canopy-agent",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiohttp>=3.9",
]

[project.entry-points."canopy.menu_sync"]
weedmaps = "canopy_menusync_weedmaps:WeedmapsMenuSync"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canopy_menusync_weedmaps*"]
