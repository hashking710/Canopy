[project]
name = "canopy-adapter-trolmaster"
version = "0.1.0"
description = "TrolMaster cloud API sensor adapter plugin for Canopy (blocked on vendor API access — see package docstring)"
requires-python = ">=3.11"
dependencies = [
    "canopy-agent",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.entry-points."canopy.sensor_adapters"]
trolmaster_cloud = "canopy_adapter_trolmaster:TrolMasterCloudAdapter"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canopy_adapter_trolmaster*"]
