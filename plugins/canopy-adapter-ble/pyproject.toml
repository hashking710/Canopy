[project]
name = "canopy-adapter-ble"
version = "0.1.0"
description = "Generic BLE GATT characteristic-read sensor adapter for Canopy — works with any device exposing a numeric value over a Bluetooth Low Energy characteristic"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "canopy-agent",
    "bleak>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.entry-points."canopy.sensor_adapters"]
ble = "canopy_adapter_ble:BleAdapter"
ble_advertisement = "canopy_adapter_ble:BleAdvertisementAdapter"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canopy_adapter_ble*"]
