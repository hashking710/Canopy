name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build source tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="canopy-${VERSION}/" \
            -o "canopy-${VERSION}.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "canopy-${VERSION}.tar.gz" > "canopy-${VERSION}.tar.gz.sha256"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$GITHUB_REF_NAME" \
            "canopy-${VERSION}.tar.gz" \
            "canopy-${VERSION}.tar.gz.sha256" \
            deploy/install.sh \
            --title "Canopy ${VERSION}" \
            --generate-notes
