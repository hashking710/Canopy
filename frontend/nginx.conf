server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router) — any path that isn't a real static file
    # falls back to index.html so e.g. /compliance on a hard refresh doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
